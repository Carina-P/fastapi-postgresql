services:
  app:
    build: .
    environment:
      DB_USER: postgres
      DB_PASSWORD: learning
      DB_NAME: learning
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: learning
      POSTGRES_DB: learning
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: