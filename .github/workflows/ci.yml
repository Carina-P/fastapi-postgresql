name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_USER: postgres
      DB_PASSWORD: learning
      DB_NAME: learning_test_db
      DB_HOST: localhost
      DB_PORT: 5432

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: learning
          POSTGRES_DB: learning_test_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d learning_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Check python version
        run: python --version
      
      - name: Check database connection
        run: |
          python -c "
          from app.database import execute_returning_one
        
          result = execute_returning_one('SELECT 1 AS value;', [])
          assert result['value'] == 1
          print('Database connection successful')
          "
      
      - name: Initialize test database
        run: python db/init_db.py
      
      - name: Run tests
        run: python -m pytest tests/
  
  build:
    needs: test
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Build Docker image
        run: docker build -t fastapi-postgresql:latest .